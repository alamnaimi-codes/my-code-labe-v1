<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Code Editor - My CodeLab</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
        }

        /* NAVBAR */

        .navbar {
            height: 65px;
            background: #111827;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;

            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .logo span {
            color: #38bdf8;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #2563eb;

            padding: 9px 15px;

            border-radius: 7px;
        }

        /* MAIN */

        .container {
            max-width: 1200px;
            margin: 25px auto;

            padding: 0 20px;
        }

        .title {
            margin-bottom: 20px;
        }

        .title h1 {
            margin-bottom: 6px;
        }

        .title p {
            color: #94a3b8;
        }

        /* EDITOR */

        .editor-box {
            background: #1e293b;

            border: 1px solid #334155;

            border-radius: 12px;

            padding: 20px;
        }

        .controls {
            display: flex;

            gap: 12px;

            margin-bottom: 15px;
        }

        input,
        select {
            padding: 12px;

            border-radius: 7px;

            border: 1px solid #475569;

            background: #0f172a;

            color: white;
        }

        input {
            flex: 1;
        }

        select {
            width: 150px;
        }

        textarea {
            width: 100%;

            height: 400px;

            resize: vertical;

            padding: 18px;

            background: #020617;

            color: #e2e8f0;

            border: 1px solid #334155;

            border-radius: 8px;

            font-family: Consolas, monospace;

            font-size: 15px;

            line-height: 1.6;

            outline: none;
        }

        textarea:focus {
            border-color: #38bdf8;
        }

        .save {
            margin-top: 15px;

            padding: 12px 20px;

            border: none;

            border-radius: 7px;

            background: #16a34a;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        .save:hover {
            background: #15803d;
        }

        /* FILES */

        .files {
            margin-top: 25px;

            background: #1e293b;

            padding: 20px;

            border-radius: 12px;

            border: 1px solid #334155;
        }

        .file {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 12px;

            border-bottom: 1px solid #334155;
        }

        .file:last-child {
            border-bottom: none;
        }

        .delete {
            background: #dc2626;

            color: white;

            border: none;

            padding: 7px 10px;

            border-radius: 5px;

            cursor: pointer;
        }

        .tag {
            color: #38bdf8;

            margin-left: 10px;

            font-size: 13px;
        }

        @media(max-width:700px) {

            .controls {
                flex-direction: column;
            }

            select {
                width: 100%;
            }

            textarea {
                height: 300px;
            }

        }

    </style>

</head>

<body>


<!-- NAVBAR -->

<div class="navbar">

    <div class="logo">
        My<span>CodeLab</span>
    </div>

    <a href="/" class="back">
        ← Dashboard
    </a>

</div>


<div class="container">


    <div class="title">

        <h1>💻 Code Editor</h1>

        <p>
            Write, save and manage your programming code.
        </p>

    </div>


    <!-- EDITOR -->

    <div class="editor-box">

        <form action="/save-code" method="POST">


            <div class="controls">

                <input
                    type="text"
                    name="filename"
                    placeholder="File name (example: factorial.c)"
                    required
                >


                <select name="language" required>

                    <option value="">
                        Language
                    </option>

                    <option value="C">
                        C
                    </option>

                    <option value="C++">
                        C++
                    </option>

                    <option value="Python">
                        Python
                    </option>

                    <option value="Java">
                        Java
                    </option>

                    <option value="JavaScript">
                        JavaScript
                    </option>

                    <option value="SQL">
                        SQL
                    </option>

                </select>

            </div>


            <textarea
                name="code"
                placeholder="// Write your code here..."
                required
            ></textarea>


            <button class="save" type="submit">
                💾 Save Code
            </button>

        </form>

    </div>


    <!-- SAVED FILES -->

    <div class="files">

        <h2>📁 My Code Files</h2>

        <br>


        {% if code_files %}

            {% for file in code_files %}

            <div class="file">

                <div>

                    💻 <strong>
                        {{ file["filename"] }}
                    </strong>

                    <span class="tag">
                        {{ file["language"] }}
                    </span>

                </div>


                <div style="display:flex; gap:10px; align-items:center;">
                    <a href="/edit-code/{{ file['id'] }}">
                        <button type="button" class="edit" style="background:#f59e0b; padding:7px 10px; border-radius:5px; color:white; border:none; cursor:pointer;">
                            Edit
                        </button>
                    </a>
                    <a href="/delete-code/{{ file['id'] }}">
                        <button type="button" class="delete">
                            Delete
                        </button>
                    </a>
                </div>

            </div>

            {% endfor %}

        {% else %}

            <p style="color:#94a3b8;">
                No code files saved yet.
            </p>

        {% endif %}

    </div>


</div>

</body>

</html>
